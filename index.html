<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (() => {
        const pulseOS = /(^|\.)pulseosplatform\.com$/i.test(location.hostname);
        const name = pulseOS ? 'PulseOS Platform' : 'DATAPULSE SOCIAL';
        const icon = pulseOS ? '/pulseos-favicon.svg' : '/favicon-32.png';
        const manifest = pulseOS ? '/pulseos-manifest.json' : '/manifest.json';
        const iconType = pulseOS ? 'image/svg+xml' : 'image/png';
        document.write(`<title>${name}</title>`);
        document.write(`<meta name="theme-color" content="#0a1a2f">`);
        document.write(`<link rel="manifest" href="${manifest}">`);
        document.write(`<link rel="apple-touch-icon" href="${icon}">`);
        document.write(`<link rel="icon" type="${iconType}" sizes="32x32" href="${icon}">`);
        document.write(`<link rel="icon" type="${iconType}" sizes="16x16" href="${icon}">`);
        document.write(`<meta name="apple-mobile-web-app-capable" content="yes">`);
        document.write(`<meta name="apple-mobile-web-app-status-bar-style" content="default">`);
        document.write(`<meta name="apple-mobile-web-app-title" content="${name}">`);
      })();
    </script>
