    <script>
      (function () {
        var h = window.location.hostname.toLowerCase();
        var p = window.location.pathname.replace(/\/$/, '') || '/';
        var isSafety = h === 'safetyapp.com' || h === 'www.safetyapp.com';
        var isStatsLab = h === 'statslab.app' || h === 'www.statslab.app';
        var isPulseOS = h === 'pulseosplatform.com' || h === 'www.pulseosplatform.com' || p === '/pulseos';
        var isHarbor = h === 'harborhush.website' || h === 'www.harborhush.website';

        var manifestHref = '/manifest.json';
        var appleHref = '/apple-touch-icon.png';
        var fav32Href = '/favicon-32.png';
        var fav16Href = '/favicon-16.png';
        var themeColor = '#0a1a2f';
        var appTitle = 'DATAPULSE SOCIAL';

        if (isSafety) {
          manifestHref = '/safety-manifest.json';
          appleHref = '/safety-apple-touch-icon.png';
          fav32Href = '/safety-favicon-32.png';
          fav16Href = '/safety-favicon-16.png';
          themeColor = '#07131f';
          appTitle = 'Safety App';
        } else if (isStatsLab) {
          manifestHref = '/statslab-manifest.json';
          appleHref = '/statslab-app-icon.webp';
          fav32Href = '/statslab-app-icon.webp';
          fav16Href = '/statslab-app-icon.webp';
          appTitle = 'StatsLab';
        } else if (isPulseOS) {
          manifestHref = '/pulseos-manifest.json';
          appleHref = '/pulseos-icon-512.webp';
          fav32Href = '/pulseos-icon-512.webp';
          fav16Href = '/pulseos-icon-512.webp';
          appTitle = 'PulseOS';
        } else if (isHarbor) {
          themeColor = '#1a3a42';
          appTitle = 'Harbor';
        }

        function createLink(rel, href, attrs) {
          var link = document.createElement('link');
          link.setAttribute('rel', rel);
          link.setAttribute('href', href);
          if (attrs) {
            for (var k in attrs) link.setAttribute(k, attrs[k]);
          }
          document.head.appendChild(link);
        }

        createLink('manifest', manifestHref);
        createLink('apple-touch-icon', appleHref);
        createLink('icon', fav32Href, { type: 'image/png', sizes: '32x32' });
        createLink('icon', fav16Href, { type: 'image/png', sizes: '16x16' });

        document.querySelector('meta[name="theme-color"]').setAttribute('content', themeColor);
        document.querySelector('meta[name="apple-mobile-web-app-title"]').setAttribute('content', appTitle);
      })();
    </script>
